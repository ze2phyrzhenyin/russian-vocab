name: code-and-fixture-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_USER: slovo
          POSTGRES_PASSWORD: ci-isolated-test-only
          POSTGRES_DB: ruslearn_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U slovo -d ruslearn_dev'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://slovo:ci-isolated-test-only@localhost:5432/ruslearn_dev
      BETTER_AUTH_SECRET: ci-only-isolated-database-no-deployment-secret-00000000
      BETTER_AUTH_URL: http://localhost:4186
      APP_ENV: development
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements.txt
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: python -m unittest discover -s tests/importer -v
      - run: pnpm build
      # Full private-workbook/content/OCR/browser gates run in the private workspace.
      # The copyrighted source workbook and extracted content are never CI fixtures.
