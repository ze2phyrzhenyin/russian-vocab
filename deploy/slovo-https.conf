server {
    listen 80;
    listen [::]:80;
    server_name slovo.zhaoyang.fr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/slovo-acme; }
    location / { return 308 https://slovo.zhaoyang.fr$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name slovo.zhaoyang.fr;
    ssl_certificate /etc/letsencrypt/live/slovo.zhaoyang.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slovo.zhaoyang.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 1m;
    access_log /var/log/nginx/slovo.access.log;
    error_log /var/log/nginx/slovo.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    location / {
        proxy_pass http://127.0.0.1:58092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
