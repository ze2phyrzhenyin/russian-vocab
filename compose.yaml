name: slovo-demo
services:
  db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set isolated demo database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    ports:
      - "127.0.0.1:55486:5432"
    volumes:
      - slovo-postgres:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: slovo-demo-app:local
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Generate auth secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4186}
      APP_ENV: development
      DEMO_MODE: "true"
      HOSTNAME: 0.0.0.0
      PORT: 4186
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4186:4186"
    volumes:
      - ./data/assets:/app/data/assets:ro
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
volumes:
  slovo-postgres:
